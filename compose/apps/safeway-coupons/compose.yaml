networks:
  web:
    external: true

services:
  safeway-coupons:
    image: ghcr.io/smkent/safeway-coupons:latest
    environment:
      CRON_SCHEDULE: "42 13 * * *"
      SMTPHOST: smtp
    networks:
      - web
    restart: unless-stopped
    volumes:
      - ../../volumes/${COMPOSE_PROJECT_NAME}/config:/storage/config:rw
      - ../../volumes/${COMPOSE_PROJECT_NAME}/state:/storage/state:rw
