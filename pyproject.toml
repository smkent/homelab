[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "homelab"
dynamic = ["version"]
description = "Self-hosted apps I run on my homelab and personal infrastructure. Deployments are managed by Ansible."
readme = "README.md"
license = "GPL-3.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    { name = "Stephen Kent", email = "smkent@smkent.net" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Documentation",
    "Topic :: Software Development",
    "Topic :: Utilities",
    "Typing :: Typed",
]
keywords = []
dependencies = [
    "ansible-core",
    "gnupg",
    "passlib",
    "ruamel-yaml>=0.19.1,<0.20.0",
    "typer>=0.21.1,<0.22.0",
    "mitogen>=0.3.39,<0.4.0",
]

[project.scripts]
hm = "homelab.homerun:Homerun.app"
homerun = "homelab.homerun:Homerun.app"
homestar = "homelab.homestar:Homestar.app"

[project.urls]
Homepage = "https://github.com/smkent/homelab"
Repository = "https://github.com/smkent/homelab"
Issues = "https://github.com/smkent/homelab/issues"

[dependency-groups]
dev = [
    "bump-my-version>=1.3.0",
    "pysentry-rs>=0.4",
    "pytest>=9",
    "pytest-cov>=7",
    "pytest-sugar>=1",
    "pytest-xdist>=3",
    "ruff>=0.15",
    "syrupy>=5",
    "ty>=0.0.49",
]

[tool.bumpversion]
commit = false
tag = true
tag_name = "v{new_version}"
tag_message = ""
push = true

[tool.hatch.build.targets.sdist]
include = ["/homelab", "/tests", "*.md", "LICENSE"]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.pytest]
addopts = [
    "-ra",
    "--cov=homelab",
    "--strict-config",
    "--strict-markers",
    "--numprocesses",
    "auto",
]
testpaths = ["tests"]

[tool.coverage.run]
source = ["homelab"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.ruff]
line-length = 79
output-format = "concise"
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed
    "COM812",  # Trailing comma missing
    "CPY001",  # Missing copyright notice at top of file
    "D1",  # Missing docstring presence rules
    "EM",  # flake8-errmsg
    "G004",  # Logging statement uses f-string
    "PLR",  # pylint Refactor
    "S607",  # Starting a process with a partial executable path
    "TD",  # flake8-todos
    "TRY003", # Avoid specifying long messages outside the exception class
]

[tool.ruff.lint.isort]
known-first-party = ["homelab"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ARG",  # flake8-unused-arguments
    "S101",  # Use of assert detected
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.src]
include = ["homelab/", "tests/"]

[tool.ty.terminal]
error-on-warning = true
output-format = "concise"

[tool.uv]
default-groups = ["dev"]

[tool.uv-dynamic-versioning]
pattern = "default-unprefixed"
fallback-version = "0.0.0"
