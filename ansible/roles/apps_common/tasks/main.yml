  - block:
      - name: "Ensure homelab repository is present"
        ansible.builtin.git:
          repo: https://github.com/smkent/homelab
          dest: '{{ deploy_user_home }}/homelab'
          version: main
          accept_hostkey: true
        environment:
          GIT_TERMINAL_PROMPT: 0
        register: homelab_git_repo
        ignore_errors: '{{ ansible_check_mode }}'
        when:
          - ensure_homelab_repo | d(True)

      - name: "Ensure mise packages are installed"
        ansible.builtin.command:
          cmd: "mise install {% if ansible_check_mode %}--dry-run{% endif %}"
          chdir: '{{ deploy_user_home }}/homelab'
        register: apps_common_mise_install_check
        check_mode: false
        changed_when: "'all tools are installed' not in apps_common_mise_install_check.stderr"

      - name: "Set docker secrets directory fact"
        ansible.builtin.set_fact:
          deploy_user_secrets_dir: "{{ deploy_user_home }}/homelab/compose/secrets/"
          deploy_user_volumes_dir: "{{ deploy_user_home }}/homelab/compose/volumes/"

      - name: "Ensure {{ deploy_user }} compose directories have proper permissions"
        ansible.builtin.file:
          path: "{{ item }}"
          owner: "{{ deploy_user }}"
          group: "{{ deploy_user }}"
          mode: 0700
          state: directory
        loop:
          - "{{ deploy_user_secrets_dir }}"
          - "{{ deploy_user_volumes_dir}}"

      - name: "Ensure app config templates are installed"
        ansible.builtin.template:
          src: "{{ item }}.env.j2"
          dest: "{{ deploy_user_secrets_dir }}/{{ item }}.env"
          owner: "{{ deploy_user }}"
          group: "{{ deploy_user }}"
          mode: 0600
        diff: false
        loop: "{{ app_config_templates }}"

      - name: "Ensure Docker secrets are installed"
        ansible.builtin.copy:
          dest: "{{ deploy_user_secrets_dir }}/{{ item }}"
          content: "{{ compose_secrets[item] }}"
          owner: "{{ deploy_user }}"
          group: "{{ deploy_user }}"
          mode: 0600
        diff: false
        loop: "{{ compose_secrets.keys() | sort }}"

      - name: "Locate existing installed Docker secrets"
        ansible.builtin.find:
          paths: "{{ deploy_user_secrets_dir }}"
          file_type: file
          excludes: >-
            {{
              compose_secrets.keys() | list
              + (app_config_templates | map('regex_replace', '$', '.env') | list)
            }}
        register: existing_compose_secrets

      - name: "Ensure unused Docker secrets are removed"
        ansible.builtin.file:
          path: "{{ deploy_user_secrets_dir }}/{{ item }}"
          state: absent
        diff: false
        loop: >-
          {{
            existing_compose_secrets.files
            | map(attribute='path')
            | map('basename')
            | list
            | sort
          }}

    become: "{{ ansible_ssh_user != deploy_user }}"
    become_user: "{{ deploy_user }}"
