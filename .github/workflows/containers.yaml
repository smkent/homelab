name: Containers

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - v[0-9]*.[0-9]*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  discover:
    name: "Discover builds"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: 💾 Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: 🔭 Discover container images to build
        id: set-matrix
        run: |
          base_ref="${{ github.event.before }}"
          head_ref="${{ github.event.after }}"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            base_ref="${{ github.event.pull_request.base.sha }}"
            head_ref="${{ github.event.pull_request.head.sha }}"
          fi
          if git diff --diff-filter=d --name-only "${base_ref}" "${head_ref}" | grep -q "^\.github/workflows"; then
            changed_dirs="$(git ls-files | { grep "^compose/images/.*/Dockerfile$" || true; } | sort -u)"
          else
            changed_dirs="$(git diff --diff-filter=d --name-only "${base_ref}" "${head_ref}" | { grep "^compose/images/.*/Dockerfile$" || true; } | sort -u)"
          fi
          if [ -n "${changed_dirs}" ]; then
            json="$(printf '%s\n' "$(echo "${changed_dirs}" | xargs -n1 dirname | xargs -n1 basename)" | jq -R . | jq -s -c .)"
          else
            json="[]";
          fi
          echo "matrix={\"image\":${json}}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build and push / ${{ matrix.image }}
    needs: discover
    if: ${{ fromJson(needs.discover.outputs.matrix).image[0] != null }}
    strategy:
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      output: image
      push: true
      context: ./compose/images/${{ matrix.image }}
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-mode: max
      cache-scope: ${{ matrix.image }}
      set-meta-labels: true
      meta-images: ghcr.io/${{ github.repository_owner }}/homelab/${{ matrix.image }}
      meta-tags: |
        type=raw,value=latest,enable={{ is_default_branch }}
        type=ref,event=branch
        type=ref,event=pr
      meta-labels: |
        org.opencontainers.image.title=homelab image for ${{ matrix.image }}
        org.opencontainers.image.description=customized homelab image for ${{ matrix.image }}
        org.opencontainers.image.licenses=
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
